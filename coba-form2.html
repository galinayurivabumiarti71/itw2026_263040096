<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contoh input atribut, checkbox, & radio </title>
</head>
<body>
  <h1>contoh input atribut, checkbox, & radio</h1>
  <form>
    <label for="nama">Nama:</label>
    <input type="text" name="nama" id="nama" placeholder="Masukkan nama anda" autocomplete="off" autofocus required>
    <lable>
      <br>

      <h3>hobby:</h3>
      <lable for="hobby1">olahraga
        <input type="checkbox" name="hobby" id="hobby1" value="olahraga">
      </lable>
      <br>
      <button type="submit">Kirim!</button>
      <br>
      <h3>Jenis Kelamin:</h3>
      <lable for="laki-laki">Laki-laki
        <input type="radio" name="gender" id="laki-laki" value="laki-laki">
      </lable>
      <br>
      <lable for="perempuan">Perempuan
        <input type="radio" name="gender" id="perempuan" value="perempuan">
      </lable>
    </lable> 
  </body>
</html>
