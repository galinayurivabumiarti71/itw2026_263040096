<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba element form</title>
</head>
<body>
  <h1>contoh elemen-elemen form pada html</h1>

  <form>
    <label for="nama">Nama:
      <input type="text" name="nama" id="nama" placeholder="Masukkan nama anda"><br>
      <label for="password">password:</label>
      <input type="password" name="password" id="password" placeholder="Masukkan password anda"><br>
      <label for="email">email:</label>
      <input type="email" name="email" id="email" placeholder="Masukkan email anda">
      </label>
      <br>
      <button type="submit">Submit</button>
  </form>
</body>
</html>
