<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coba elemen form di dalam table</title>
</head>
<body>
  <h1>contoh elemen form pada html di dalam table</h1>
  <table>
    <tr>
      <td align="right"><label for="nama">Nama:</label></td>
      <td><input type="text" id="nama" name="nama" placeholder="Masukkan nama anda"></td>
    </tr>
    <tr>
      <td align="right"><label for="password">Password:</label></td>
      <td><input type="password" id="password" name="password""></td>
    </tr>
    <tr>
      <td align="right"><label for="email">Email:</label></td>
      <td><input type="email" id="email" name="email"></td>
    </tr>
    <tr>
      <td align="right"><label for="angka">Angka:</label></td>
      <td><input type="number" id="angka" name="angka"></td>
    </tr>
    <tr>
      <td align="right"><label for="tanggal">Tanggal:</label></td>
      <td><input type="date" id="tanggal" name="tanggal"></td>
    </tr><tr>
      <td align="right"><label for="warna">Warna:</label></td>
      <td><input type="color" id="warna" name="warna"></td>
    </tr>
    <tr>
      <td colspan="2"><button type="submit">submit</button></td>
  </tr>
</table>


</body> 
</html>
